name: Release
# #249, #271: scripts/release.sh --publish builds the Developer ID signed, notarized DMG and publishes it on the
# GitHub Release for a tag. The owner publishes from their Mac (docs/release.md) because no signing secret is in
# CI yet. A tag push doesn't start this job. A manual run on a tag stops at the credential check, so CI never
# publishes an unsigned DMG. Signing in CI needs GitHub secrets for the certificate and the notary key first.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    # Pinned toolchain (.toolchain-versions), the same as CI.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish
        run: sh ./scripts/release.sh --publish "$GITHUB_REF_NAME"
      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          echo "release: $STATUS — $GITHUB_REF_NAME. Re-run: gh run rerun ${{ github.run_id }} --failed" >> "$GITHUB_STEP_SUMMARY"
